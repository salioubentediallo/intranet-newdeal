name: CD Pipeline - Prod

on:
  push:
    branches:
      - prod

jobs:
  scan:
    name: Scan securite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan image
        run: trivy image --exit-code 0 saliou2026/intranet-newdeal:latest

      - name: Scan secrets
        run: trivy fs --scanners secret .

  deploy:
    name: Deploiement prod
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Pull image
        run: docker pull saliou2026/intranet-newdeal:latest

      - name: Deploy container
        run: |
          docker stop intranet || true
          docker rm intranet || true
          docker run -d --name intranet -p 80:80 saliou2026/intranet-newdeal:latest