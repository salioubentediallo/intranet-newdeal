name: CI Pipeline - Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: docker build -t saliou2026/intranet-newdeal:latest .

      - name: Push image
        run: docker push saliou2026/intranet-newdeal:latest

  scan:
    name: Scan securite
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan vulnerabilites image
        run: trivy image --exit-code 0 saliou2026/intranet-newdeal:latest

      - name: Scan secrets code
        run: trivy fs --scanners secret .

  push:
    name: Push vers Docker Hub
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push image
        run: |
          docker build -t saliou2026/intranet-newdeal:latest .
          docker push saliou2026/intranet-newdeal:latest